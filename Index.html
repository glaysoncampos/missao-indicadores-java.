<!doctype html>
<html lang="pt-BR">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7d0909">
    <meta name="description" content="Missão Indicadores: um jogo de decisão para equipes da recepção hospitalar.">
    <title>Missão Indicadores · J.A.V.A. Treinamentos</title>
    <style>
:root {
  color-scheme: light;
  --java: #7d0909;
  --java-dark: #5d0808;
  --java-soft: #f7e9e8;
  --ink: #241d1d;
  --muted: #675e5c;
  --line: #e5d9d5;
  --paper: #fffdfb;
  --canvas: #f8f5f2;
  --good: #226d52;
  --good-soft: #e4f4eb;
  --shadow: 0 18px 48px rgba(69, 25, 23, .09);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas); }
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .52; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid #c76b60; outline-offset: 3px; }

.site-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: auto; padding: 13px 24px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--java); text-decoration: none; min-width: 0; }
.brand-mark { width: 39px; height: 39px; flex: 0 0 auto; border-radius: 12px; display: grid; place-items: center; background: var(--java); color: white; box-shadow: 0 5px 12px rgba(125,9,9,.17); }
.brand-mark svg { width: 25px; height: 25px; }
.brand-name { font-size: 1rem; font-weight: 850; letter-spacing: .075em; line-height: 1; }
.brand-name small { display: block; font-size: .57rem; letter-spacing: .26em; font-weight: 750; margin-top: 6px; }
.topbar-note { color: var(--muted); font-size: .84rem; font-weight: 600; white-space: nowrap; }
.page { width: min(100%, 1180px); margin: 0 auto; padding: 30px 24px 52px; flex: 1; }
.page.narrow { max-width: 760px; }
.footer { padding: 18px 24px; text-align: center; color: #7f7572; font-size: .76rem; border-top: 1px solid var(--line); }

.hero { background: linear-gradient(135deg, #630a0a 0%, #840c0c 58%, #a8322d 100%); border-radius: 28px; color: white; min-height: 410px; padding: clamp(28px, 5vw, 60px); position: relative; overflow: hidden; display: grid; grid-template-columns: 1.35fr .65fr; gap: 20px; align-items: center; box-shadow: var(--shadow); }
.hero:before, .hero:after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; width: 500px; height: 500px; right: -140px; top: -240px; }
.hero:after { width: 300px; height: 300px; right: 40px; top: 230px; }
.hero-copy, .hero-art { position: relative; z-index: 1; }
.eyebrow { text-transform: uppercase; letter-spacing: .15em; font-size: .72rem; font-weight: 850; }
.brand-eyebrow { color: var(--java); }
.hero .eyebrow { color: #ffe2df; }
.hero h1 { font-family: Georgia, Cambria, serif; font-size: clamp(2.5rem, 5vw, 5rem); line-height: .98; letter-spacing: -.045em; max-width: 680px; margin: 20px 0 22px; }
.hero p { max-width: 550px; font-size: clamp(1rem, 1.8vw, 1.2rem); line-height: 1.55; color: #ffeceb; margin: 0; }
.hero-art { display: flex; justify-content: center; }
.signal-graphic { width: min(100%, 285px); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.34); border-radius: 30px; background: rgba(255,255,255,.09); backdrop-filter: blur(8px); padding: 27px; transform: rotate(7deg); box-shadow: 0 25px 35px rgba(49,3,3,.17); }
.graphic-header { height: 10px; width: 48%; background: rgba(255,255,255,.65); border-radius: 30px; margin-bottom: 30px; }
.graphic-row { height: 17px; margin: 20px 0; display: flex; align-items: center; gap: 14px; }
.graphic-row:before { content: ""; width: 20px; height: 20px; border-radius: 6px; background: #fff; }
.graphic-row span { display: block; height: 12px; border-radius: 20px; background: rgba(255,255,255,.68); }
.graphic-row:nth-child(2) span { width: 66%; }
.graphic-row:nth-child(3) span { width: 75%; }
.graphic-row:nth-child(4) span { width: 51%; }
.graphic-row:nth-child(5) span { width: 90%; }
.graphic-trend { margin-top: 30px; height: 75px; border-left: 2px solid rgba(255,255,255,.5); border-bottom: 2px solid rgba(255,255,255,.5); position: relative; }
.graphic-trend svg { width: 100%; height: 100%; }
.role-grid { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.role-card { text-align: left; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); padding: 24px; color: var(--ink); box-shadow: 0 8px 30px rgba(46,18,17,.04); transition: transform .18s, border-color .18s, box-shadow .18s; }
.role-card:hover { transform: translateY(-3px); border-color: #b87b75; box-shadow: var(--shadow); }
.role-card strong { display: block; font-size: 1.28rem; margin: 13px 0 6px; }
.role-card p { margin: 0; color: var(--muted); line-height: 1.5; }
.role-icon { background: var(--java-soft); color: var(--java); display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 13px; font-size: 1.3rem; }
.role-arrow { color: var(--java); float: right; font-size: 1.35rem; }
.meta-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.meta-strip span { background: #fff; color: #6b5150; border: 1px solid var(--line); border-radius: 99px; padding: 9px 13px; font-size: .84rem; font-weight: 700; }

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: clamp(22px, 4vw, 36px); box-shadow: var(--shadow); }
.panel + .panel { margin-top: 18px; }
.back-link { border: none; padding: 0; color: var(--java); background: transparent; font-weight: 750; display: inline-flex; gap: 7px; align-items: center; margin-bottom: 18px; }
.form-title { font-family: Georgia, Cambria, serif; font-size: clamp(2rem, 4vw, 2.9rem); margin: 0 0 8px; letter-spacing: -.035em; }
.form-lead { color: var(--muted); margin: 0 0 24px; line-height: 1.55; }
.field { display: block; font-weight: 750; font-size: .92rem; margin: 17px 0 7px; }
.text-input { display: block; width: 100%; border: 1.5px solid #d5c8c4; border-radius: 13px; padding: 14px 16px; color: var(--ink); background: #fff; font-size: 1rem; min-height: 52px; }
.text-input::placeholder { color: #a39a97; }
.text-input.code { letter-spacing: .16em; text-transform: uppercase; font-weight: 800; }
.primary-button, .secondary-button, .outline-button { border-radius: 13px; min-height: 50px; padding: 12px 20px; font-weight: 800; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 9px; text-align: center; }
.primary-button { background: var(--java); color: #fff; box-shadow: 0 7px 16px rgba(125,9,9,.17); }
.primary-button:hover:not(:disabled) { background: var(--java-dark); }
.secondary-button { background: var(--java-soft); color: var(--java); }
.secondary-button:hover:not(:disabled) { background: #f1d5d1; }
.outline-button { background: #fff; color: var(--java); border-color: #cba7a2; }
.outline-button:hover:not(:disabled) { background: #fff7f6; }
.full { width: 100%; }
.form-actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; }
.helper { color: var(--muted); font-size: .86rem; line-height: 1.5; }
.error { background: #fff0ed; color: #792116; border: 1px solid #e8b5ab; border-radius: 13px; padding: 13px 16px; margin-bottom: 18px; font-weight: 650; }
.notice { background: #fff7eb; color: #5b4025; border: 1px solid #ead7b8; border-radius: 14px; padding: 16px 18px; line-height: 1.5; }
.success-notice { background: var(--good-soft); color: #18503d; border-color: #b9e2cd; }

.room-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.room-heading h1 { font-family: Georgia, Cambria, serif; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -.035em; margin: 6px 0; }
.room-heading p { color: var(--muted); line-height: 1.5; margin: 0; }
.room-actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.tiny-button { color: var(--java); background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; font-weight: 750; }
.room-code { color: var(--java); letter-spacing: .15em; font-size: clamp(2.1rem, 5vw, 4.2rem); line-height: 1.05; font-weight: 900; margin: 12px 0; font-variant-numeric: tabular-nums; }
.room-code-box { background: var(--java-soft); border-radius: 20px; padding: 25px; border: 1px solid #ead2ce; }
.room-code-box .eyebrow { color: var(--java); }
.room-code-box p { margin: 0; color: #634f4d; }
.teacher-grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(260px,.55fr); gap: 18px; align-items: start; }
.team-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.team-pill { background: #f5efec; border: 1px solid var(--line); border-radius: 99px; padding: 8px 11px; color: #5f4441; font-size: .85rem; font-weight: 700; }
.statline { display: flex; align-items: center; gap: 9px; color: var(--muted); font-weight: 700; margin: 12px 0 21px; }
.stat-dot { background: var(--java); width: 9px; height: 9px; border-radius: 50%; }
.question-count { color: var(--java); font-size: .77rem; font-weight: 850; text-transform: uppercase; letter-spacing: .13em; }
.question-title { font-family: Georgia, Cambria, serif; font-size: clamp(1.8rem, 3.5vw, 2.55rem); letter-spacing: -.035em; line-height: 1.16; margin: 9px 0 15px; }
.question-story { font-size: 1.06rem; line-height: 1.62; color: #3e3331; margin: 0 0 19px; }
.signals { display: grid; gap: 9px; margin: 18px 0 21px; }
.signal { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border: 1px solid #dfd2cd; border-radius: 12px; background: #faf7f5; }
.signal-label { color: #514541; font-size: .88rem; font-weight: 650; }
.signal-value { color: var(--java); font-weight: 850; text-align: right; white-space: nowrap; }
.options { display: grid; gap: 11px; margin: 20px 0 0; }
.option { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: #fff; border: 1.5px solid #d9ccc8; border-radius: 15px; padding: 15px; color: var(--ink); min-height: 62px; line-height: 1.42; }
.option:hover:not(:disabled) { border-color: #a9615b; background: #fff9f8; }
.option.selected { border-color: var(--java); background: #fff3f1; box-shadow: inset 0 0 0 1px var(--java); }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.wrong { border-color: #b45f51; background: #fff0ee; }
.option-letter { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; background: var(--java-soft); color: var(--java); font-size: .85rem; font-weight: 900; }
.option.correct .option-letter { background: var(--good); color: #fff; }
.option.wrong .option-letter { background: #a94637; color: #fff; }
.option-text { flex: 1; }
.option-meta { font-size: .82rem; font-weight: 800; white-space: nowrap; }
.option-bar { margin-top: 9px; }
.option-bar progress { width: 100%; height: 9px; accent-color: var(--java); }
.question-footer { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.question-footer .primary-button { min-width: 190px; }
.answer-note { color: var(--muted); font-size: .88rem; line-height: 1.4; }
.explanation { margin-top: 22px; background: var(--good-soft); border: 1px solid #b9e2cd; border-radius: 16px; padding: 19px; }
.explanation h3 { color: #18503d; font-size: .98rem; margin: 0 0 7px; }
.explanation p { margin: 0; line-height: 1.55; }
.takeaway { margin-top: 10px !important; color: #1d5844; font-weight: 750; }
.progress-track { display: flex; gap: 5px; margin: 16px 0 24px; }
.progress-track span { height: 7px; border-radius: 10px; background: #e7dad5; flex: 1; }
.progress-track span.done { background: var(--java); }
.waiting-icon { width: 74px; height: 74px; border-radius: 25px; display: grid; place-items: center; background: var(--java-soft); color: var(--java); font-size: 2rem; margin-bottom: 20px; }
.waiting-title { font-family: Georgia, Cambria, serif; font-size: clamp(1.9rem,4vw,2.5rem); letter-spacing: -.03em; margin: 0 0 12px; }
.waiting-copy { color: var(--muted); line-height: 1.55; max-width: 620px; }
.waiting-steps { display: grid; gap: 12px; margin: 25px 0 0; }
.waiting-step { display: flex; gap: 12px; align-items: center; color: #4d4140; font-weight: 650; }
.waiting-step b { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 50%; background: var(--java-soft); color: var(--java); display: grid; place-items: center; }
.scoreboard { width: 100%; border-collapse: collapse; margin-top: 18px; }
.scoreboard th, .scoreboard td { text-align: left; padding: 13px 9px; border-bottom: 1px solid var(--line); }
.scoreboard th { color: #766966; font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; }
.scoreboard td:first-child { color: var(--java); font-weight: 900; width: 60px; }
.scoreboard td:last-child { text-align: right; font-weight: 850; width: 90px; }
.scoreboard tr.my-team { background: var(--java-soft); }
.scoreboard tr.my-team td { border-color: #e9c6c0; }
.recap { background: #f7f1ed; border-radius: 16px; padding: 19px; margin-top: 20px; line-height: 1.55; }
.recap strong { color: var(--java); }
.small-muted { font-size: .83rem; color: var(--muted); }

@media (max-width: 760px) {
  .topbar-inner { padding: 12px 16px; }
  .topbar-note { display: none; }
  .page { padding: 18px 15px 36px; }
  .hero { grid-template-columns: 1fr; min-height: 360px; border-radius: 22px; padding: 30px 25px; }
  .hero-art { display: none; }
  .role-grid, .teacher-grid { grid-template-columns: 1fr; }
  .role-card { padding: 20px; }
  .room-heading { flex-direction: column; }
  .room-actions { justify-content: flex-start; }
  .room-code-box { padding: 20px; }
  .panel { border-radius: 20px; padding: 21px; }
  .question-story { font-size: 1rem; }
  .question-footer .primary-button { width: 100%; }
  .signal { align-items: flex-start; flex-direction: column; gap: 5px; }
  .signal-value { text-align: left; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}

</style>

  <body>
    <div id="app" aria-live="polite"></div>
  <script>
const memoryStorage = new Map();
const storage = {
  getItem(key) { try { return localStorage.getItem(key); } catch { return memoryStorage.get(key) || null; } },
  setItem(key, value) { try { localStorage.setItem(key, value); } catch { memoryStorage.set(key, value); } },
  removeItem(key) { try { localStorage.removeItem(key); } catch { memoryStorage.delete(key); } },
};
const root = document.querySelector("#app");
const KEYS = { mode: "java-game-mode", teacher: "java-game-teacher", team: "java-game-team" };
const app = {
  mode: storage.getItem(KEYS.mode) || "home",
  teacher: readStored(KEYS.teacher),
  team: readStored(KEYS.team),
  state: null,
  stateSignature: "",
  draftChoice: null,
  draftFor: -1,
  error: "",
  busy: false,
};

function readStored(key) {
  try { return JSON.parse(storage.getItem(key) || "null"); }
  catch { return null; }
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[char]);
}

function letter(index) { return "ABC"[index] || ""; }
function activeSession() {
  if (app.mode === "teacher") return app.teacher;
  if (app.mode === "team") return app.team;
  return null;
}

const logo = `<span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 24.5V20h5v4.5m1-8V14h5v10.5m1-14V8h5v16.5m1-20V4h5v20.5M4 27h23M6 12l7-4 5 2 8-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;

function shell(content, narrow = false) {
  return `<div class="site-shell">
    <header class="topbar"><div class="topbar-inner">
      <a href="/" class="brand" data-action="home" aria-label="Página inicial Missão Indicadores">${logo}<span class="brand-name">J.A.V.A.<small>TREINAMENTOS</small></span></a>
      <span class="topbar-note">Missão Indicadores · recepção hospitalar</span>
    </div></header>
    <main class="page ${narrow ? "narrow" : ""}">${app.error ? `<div class="error" role="alert">${esc(app.error)}</div>` : ""}${content}</main>
    <footer class="footer">J.A.V.A. Treinamentos · simulação com dados fictícios · nenhum dado de paciente é usado</footer>
  </div>`;
}

function landing() {
  return shell(`<section class="hero">
    <div class="hero-copy"><div class="eyebrow">Aprender a decidir com dados</div>
      <h1>Os sinais contam uma história.</h1>
      <p>Em equipe, investigue um problema real da rotina hospitalar, interprete indicadores e escolha o melhor próximo passo.</p>
    </div>
    <div class="hero-art" aria-hidden="true"><div class="signal-graphic"><div class="graphic-header"></div><div class="graphic-row"><span></span></div><div class="graphic-row"><span></span></div><div class="graphic-row"><span></span></div><div class="graphic-trend"><svg viewBox="0 0 200 75" preserveAspectRatio="none"><path d="M0 68 L43 54 L82 57 L122 28 L155 33 L200 2" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></div>
  </section>
  <div class="role-grid">
    <button class="role-card" data-action="open-team"><span class="role-arrow">↗</span><span class="role-icon" aria-hidden="true">◉</span><strong>Entrar como equipe</strong><p>O líder responde pelo celular com a ajuda dos colegas.</p></button>
    <button class="role-card" data-action="open-teacher"><span class="role-arrow">↗</span><span class="role-icon" aria-hidden="true">▤</span><strong>Conduzir como professor</strong><p>Abra a sala e libere as perguntas no ritmo da turma.</p></button>
  </div>
  <div class="meta-strip"><span>5 decisões</span><span>3 alternativas por pergunta</span><span>Até 15 equipes</span><span>Placar no final</span></div>`);
}

function teamEntry() {
  return shell(`<button class="back-link" data-action="home">← Voltar</button>
    <section class="panel"><div class="eyebrow brand-eyebrow">Para o líder da equipe</div>
      <h1 class="form-title">Entre na sala</h1>
      <p class="form-lead">Conversem antes de marcar. Uma resposta representa os cinco integrantes da equipe.</p>
      <form id="join-form">
        <label class="field" for="room-code">Código da sala</label>
        <input class="text-input code" id="room-code" name="code" maxlength="7" placeholder="EX.: ABC2345" autocomplete="off" required>
        <label class="field" for="team-name">Nome da equipe</label>
        <input class="text-input" id="team-name" name="name" minlength="2" maxlength="28" placeholder="Ex.: Equipe Horizonte" autocomplete="off" required>
        <div class="form-actions"><button class="primary-button full" type="submit" ${app.busy ? "disabled" : ""}>${app.busy ? "Entrando…" : "Entrar na missão"}</button></div>
      </form>
      <p class="helper">Peça ao professor o código. A sala aceita até 15 equipes.</p>
    </section>`, true);
}

function teacherEntry() {
  return shell(`<button class="back-link" data-action="home">← Voltar</button>
    <section class="panel"><div class="eyebrow brand-eyebrow">Painel do professor</div>
      <h1 class="form-title">Prepare a missão</h1>
      <p class="form-lead">Crie uma sala, mostre o código às equipes e conduza cada pergunta quando a discussão estiver pronta.</p>
      <form id="create-form">
        <label class="field" for="teacher-pin">Senha do professor</label>
        <input class="text-input" id="teacher-pin" name="pin" type="password" autocomplete="off" required>
        <div class="form-actions"><button class="primary-button full" type="submit" ${app.busy ? "disabled" : ""}>${app.busy ? "Criando…" : "Criar sala"}</button></div>
      </form>
      <p class="helper">A senha evita que visitantes criem salas para a sua turma.</p>
    </section>`, true);
}

function roomHeader(state, teacher) {
  const title = teacher ? "Painel do professor" : esc(state.teamName);
  const actions = teacher
    ? `<button class="tiny-button" data-action="fullscreen" type="button">Modo projetor</button><button class="tiny-button" data-action="copy-code" type="button">Copiar código</button><button class="tiny-button" data-action="leave" type="button">Sair</button>`
    : `<button class="tiny-button" data-action="leave" type="button">Sair</button>`;
  return `<div class="room-heading"><div><div class="question-count">Sala ${esc(state.code)}</div><h1>${title}</h1><p>${teacher ? "Você controla o ritmo das perguntas e revela as respostas." : "Converse com a equipe e marque uma alternativa por pergunta."}</p></div><div class="room-actions">${actions}</div></div>`;
}

function signalCards(signals) {
  if (!signals?.length) return "";
  return `<div class="signals" aria-label="Indicadores do cenário">${signals.map((signal) => `<div class="signal"><span class="signal-label">${esc(signal.label)}</span><span class="signal-value">${esc(signal.value)}</span></div>`).join("")}</div>`;
}

function progress(index) {
  return `<div class="progress-track" aria-label="Pergunta ${index + 1} de 5">${[0,1,2,3,4].map((part) => `<span class="${part <= index ? "done" : ""}"></span>`).join("")}</div>`;
}

function explanation(question) {
  return `<div class="explanation"><h3>Por que a melhor resposta é ${letter(question.correct)}?</h3><p>${esc(question.explanation)}</p><p class="takeaway">${esc(question.takeaway)}</p></div>`;
}

function teamQuestion(state) {
  const q = state.question;
  const revealed = state.stage === "revealed";
  const selected = app.draftChoice;
  const submitted = state.myChoice !== null;
  const options = q.options.map((option, index) => {
    let cls = "option";
    if (!revealed && selected === index) cls += " selected";
    if (revealed && index === q.correct) cls += " correct";
    if (revealed && state.myChoice === index && index !== q.correct) cls += " wrong";
    const tag = revealed && index === q.correct ? `<span class="option-meta">Melhor escolha</span>` : "";
    return `<button class="${cls}" type="button" ${revealed ? "disabled" : `data-action="choose" data-choice="${index}"`}><span class="option-letter">${letter(index)}</span><span class="option-text">${esc(option)}</span>${tag}</button>`;
  }).join("");
  const note = revealed
    ? `<span class="answer-note">Aguarde o professor liberar a próxima pergunta.</span>`
    : `<span class="answer-note">${submitted ? "Resposta registrada. Você pode mudar até o professor encerrar a votação." : "Escolha uma alternativa e confirme."}</span>`;
  const button = revealed ? "" : `<button class="primary-button" data-action="submit-answer" type="button" ${selected === null || app.busy ? "disabled" : ""}>${app.busy ? "Enviando…" : submitted ? "Atualizar resposta" : "Confirmar resposta"}</button>`;
  return `<section class="panel">${progress(state.questionIndex)}<div class="question-count">Pergunta ${state.questionIndex + 1} de ${state.questionCount}</div><h2 class="question-title">${esc(q.title)}</h2><p class="question-story">${esc(q.story)}</p>${signalCards(q.signal)}<div class="options" role="group" aria-label="Alternativas">${options}</div><div class="question-footer">${note}${button}</div>${revealed ? explanation(q) : ""}</section>`;
}

function teacherQuestion(state) {
  const q = state.question;
  const revealed = state.stage === "revealed";
  const options = q.options.map((option, index) => {
    const count = state.distribution?.[index] || 0;
    const cls = revealed && index === q.correct ? "option correct" : "option";
    return `<div class="${cls}"><span class="option-letter">${letter(index)}</span><div class="option-text">${esc(option)}<div class="option-bar"><progress max="${Math.max(1, state.teamCount)}" value="${count}"></progress></div></div><span class="option-meta">${count} ${count === 1 ? "equipe" : "equipes"}</span></div>`;
  }).join("");
  let button;
  if (!revealed) button = `<button class="primary-button" data-action="control" data-control="reveal" type="button" ${app.busy ? "disabled" : ""}>Revelar resposta</button>`;
  else if (state.questionIndex === state.questionCount - 1) button = `<button class="primary-button" data-action="control" data-control="finish" type="button" ${app.busy ? "disabled" : ""}>Encerrar e mostrar placar</button>`;
  else button = `<button class="primary-button" data-action="control" data-control="next" type="button" ${app.busy ? "disabled" : ""}>Liberar próxima pergunta</button>`;
  return `<section class="panel">${progress(state.questionIndex)}<div class="question-count">Pergunta ${state.questionIndex + 1} de ${state.questionCount}</div><h2 class="question-title">${esc(q.title)}</h2><p class="question-story">${esc(q.story)}</p>${signalCards(q.signal)}<div class="options">${options}</div><div class="question-footer"><span class="answer-note">${state.answeredCount} de ${state.teamCount} equipes responderam</span>${button}</div>${revealed ? explanation(q) : ""}</section>`;
}

function lobby(state, teacher) {
  if (teacher) {
    return `<div class="teacher-grid"><section class="panel"><div class="room-code-box"><div class="eyebrow">Código para as equipes</div><div class="room-code">${esc(state.code)}</div><p>O líder entra no próprio celular e informa o nome da equipe.</p></div><div class="statline"><span class="stat-dot"></span>${state.teamCount} de 15 equipes na sala</div><button class="primary-button" data-action="control" data-control="start" type="button" ${state.teamCount < 1 || app.busy ? "disabled" : ""}>Iniciar primeira pergunta</button></section><aside class="panel"><div class="question-count">Equipes conectadas</div><div class="team-list">${state.teams?.length ? state.teams.map((name) => `<span class="team-pill">${esc(name)}</span>`).join("") : `<span class="small-muted">Aguardando as equipes…</span>`}</div></aside></div>`;
  }
  return `<section class="panel"><div class="waiting-icon" aria-hidden="true">✓</div><h2 class="waiting-title">Equipe conectada!</h2><p class="waiting-copy">Aguarde o professor iniciar. Enquanto isso, combinem como vão ouvir as ideias dos cinco integrantes antes de marcar cada resposta.</p><div class="notice">Sua equipe está na sala <strong>${esc(state.code)}</strong>. O jogo começará no ritmo da discussão em aula.</div><div class="waiting-steps"><div class="waiting-step"><b>1</b>Ler o caso e os indicadores</div><div class="waiting-step"><b>2</b>Conversar em equipe</div><div class="waiting-step"><b>3</b>O líder confirma uma alternativa</div></div></section>`;
}

function scoreboard(state) {
  const rows = (state.ranking || []).map((entry) => `<tr class="${state.role === "team" && entry.name === state.teamName ? "my-team" : ""}"><td>${entry.rank}º</td><td>${esc(entry.name)}</td><td>${entry.score}/5</td></tr>`).join("");
  return `<section class="panel"><div class="question-count">Missão concluída</div><h2 class="question-title">Placar final</h2><p class="question-story">As equipes investigaram o mesmo problema e tomaram decisões usando os indicadores apresentados.</p><table class="scoreboard"><thead><tr><th>Posição</th><th>Equipe</th><th>Acertos</th></tr></thead><tbody>${rows}</tbody></table><div class="recap"><strong>Para conversar com a turma:</strong> O que teríamos decidido se tivéssemos ouvido só a reclamação inicial? Qual indicador mudou o rumo da investigação?</div></section>`;
}

function roomView() {
  const state = app.state;
  const teacher = state.role === "teacher";
  const content = roomHeader(state, teacher)
    + (state.stage === "lobby" ? lobby(state, teacher)
      : state.stage === "finished" ? scoreboard(state)
      : teacher ? teacherQuestion(state) : teamQuestion(state));
  return shell(content, !teacher);
}

function render() {
  if (activeSession() && app.state) root.innerHTML = roomView();
  else if (app.mode === "team") root.innerHTML = teamEntry();
  else if (app.mode === "teacher") root.innerHTML = teacherEntry();
  else root.innerHTML = landing();
}

function callServer(name, args) {
  return new Promise((resolve, reject) => {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((error) => reject(new Error(error?.message || "Não foi possível falar com a planilha.")));
    runner[name](...args);
  });
}

async function api(path, options = {}, token = "") {
  const body = options.body ? JSON.parse(options.body) : {};
  if (path === "/api/rooms" && options.method === "POST") return callServer("createRoom", [body.pin]);
  const match = /^\/api\/rooms\/([A-Z2-9]{7})\/(join|state|answer|control)$/.exec(path);
  if (!match) throw new Error("Ação não encontrada.");
  const code = match[1];
  if (match[2] === "join") return callServer("joinRoom", [code, body.name]);
  if (match[2] === "state") return callServer("getState", [code, token]);
  if (match[2] === "answer") return callServer("submitAnswer", [code, token, body.choice]);
  return callServer("controlRoom", [code, token, body.action]);
}

async function refresh(force = false) {
  const session = activeSession();
  if (!session) return;
  try {
    const state = await api(`/api/rooms/${encodeURIComponent(session.code)}/state`, {}, session.token);
    const signature = JSON.stringify(state);
    if (force || signature !== app.stateSignature) {
      if (state.questionIndex !== app.draftFor || state.stage !== app.state?.stage) {
        app.draftChoice = state.myChoice ?? null;
        app.draftFor = state.questionIndex;
      }
      app.state = state;
      app.stateSignature = signature;
      app.error = "";
      render();
    }
  } catch (error) {
    if (String(error.message).includes("não autorizado") || String(error.message).includes("não encontrada")) {
      storage.removeItem(app.mode === "teacher" ? KEYS.teacher : KEYS.team);
      if (app.mode === "teacher") app.teacher = null;
      else app.team = null;
      app.state = null;
    }
    app.error = error.message || "Falha de conexão. Tente novamente.";
    render();
  }
}

function switchMode(mode) {
  app.mode = mode;
  app.state = null;
  app.stateSignature = "";
  app.error = "";
  storage.setItem(KEYS.mode, mode);
  render();
  if (activeSession()) refresh(true);
}

async function perform(action) {
  if (app.busy) return;
  app.busy = true;
  app.error = "";
  render();
  try { await action(); }
  catch (error) { app.error = error.message || "Falha de conexão. Tente novamente."; }
  finally { app.busy = false; render(); }
}

root.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target;
  if (form.id === "join-form") {
    const code = form.elements.code.value.trim().toUpperCase();
    const name = form.elements.name.value.trim();
    if (!/^[A-Z2-9]{7}$/.test(code)) { app.error = "O código da sala tem sete caracteres."; render(); return; }
    perform(async () => {
      const data = await api(`/api/rooms/${encodeURIComponent(code)}/join`, { method: "POST", body: JSON.stringify({ name }) });
      app.team = { code: data.code, token: data.token, name: data.name };
      storage.setItem(KEYS.team, JSON.stringify(app.team));
      await refresh(true);
    });
  }
  if (form.id === "create-form") {
    const pin = form.elements.pin.value.trim();
    perform(async () => {
      const data = await api("/api/rooms", { method: "POST", body: JSON.stringify({ pin }) });
      app.teacher = { code: data.code, token: data.token };
      storage.setItem(KEYS.teacher, JSON.stringify(app.teacher));
      await refresh(true);
    });
  }
});

root.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  const action = button.dataset.action;
  if (action === "home") { event.preventDefault(); switchMode("home"); return; }
  if (action === "open-team") { switchMode("team"); return; }
  if (action === "open-teacher") { switchMode("teacher"); return; }
  if (action === "leave") {
    const key = app.mode === "teacher" ? KEYS.teacher : KEYS.team;
    storage.removeItem(key);
    if (app.mode === "teacher") app.teacher = null; else app.team = null;
    app.state = null;
    app.stateSignature = "";
    switchMode("home");
    return;
  }
  if (action === "choose") {
    app.draftChoice = Number(button.dataset.choice);
    render();
    return;
  }
  if (action === "submit-answer") {
    if (app.draftChoice === null || !app.team) return;
    perform(async () => {
      await api(`/api/rooms/${app.team.code}/answer`, { method: "POST", body: JSON.stringify({ choice: app.draftChoice }) }, app.team.token);
      await refresh(true);
    });
    return;
  }
  if (action === "control") {
    if (!app.teacher) return;
    perform(async () => {
      await api(`/api/rooms/${app.teacher.code}/control`, { method: "POST", body: JSON.stringify({ action: button.dataset.control }) }, app.teacher.token);
      await refresh(true);
    });
    return;
  }
  if (action === "copy-code") {
    navigator.clipboard?.writeText(app.teacher?.code || "").catch(() => {});
    return;
  }
  if (action === "fullscreen") {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.();
  }
});

render();
if (activeSession()) refresh(true);
setInterval(() => {
  if (activeSession() && !app.busy && !document.hidden) refresh();
}, 5000 + Math.floor(Math.random() * 1500));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && activeSession()) refresh(true);
});

</script>
  </body>
</html>
